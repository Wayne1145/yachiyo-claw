packages:
  - .

# Supply chain security: only install packages published at least 7 days ago
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@ruguoapp/*"
  - brace-expansion

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@sentry/cli"
  - core-js
  - core-js-pure
  - esbuild
  - msw
  - protobufjs
  - sharp
  - zipfile

overrides:
  # Chevrotain 11 pins the affected utility exactly; keep its parser and grammar packages aligned.
  "@chevrotain/cst-dts-gen@11.1.2>lodash-es": 4.18.1
  "@chevrotain/gast@11.1.2>lodash-es": 4.18.1
  "chevrotain@11.1.2>lodash-es": 4.18.1
  "@tanstack/router-generator": 1.120.15
  "@tanstack/router-plugin": 1.120.15
  "@modelcontextprotocol/sdk>@hono/node-server": "^2.1.6"
  # These callers use glob/globSync. Upgrade their walker with its matcher; swapping
  # minimatch alone breaks older walkers that expect RegExp entries in the compiled pattern.
  "@sentry/bundler-plugin-core@4.8.0>glob": 14.0.6
  "rimraf@4.4.1>glob": 14.0.6
  "rimraf@5.0.10>glob": 14.0.6
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=5.0.0 <5.0.8": 5.0.9
  convict: ">=6.2.5"
  dompurify: "^3.4.9"
  # Ajv 8 uses fast-uri 3.x. The 3.1.9 backport fixes URI normalization in that branch.
  "ajv@8.17.1>fast-uri": "^3.1.9"
  fast-xml-parser: "^5.12.1"
  handlebars: ">=4.7.9"
  hono: "^4.13.16"
  protobufjs: "^7.5.5"
  shell-quote: "^1.10.0"

patchedDependencies:
  "@ai-sdk/deepseek@2.0.17": patches/@ai-sdk__deepseek@2.0.17.patch
  '@capacitor-community/sqlite@7.0.3': patches/@capacitor-community__sqlite@7.0.3.patch
  capacitor-stream-http@0.1.0: patches/capacitor-stream-http@0.1.0.patch
  "mdast-util-gfm-autolink-literal@2.0.1": patches/mdast-util-gfm-autolink-literal@2.0.1.patch
